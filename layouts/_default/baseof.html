<!DOCTYPE html>
<html lang="{{ with .Site.Language.Lang }}{{ . }}{{ else }}en{{ end }}">
    {{- partial "head.html" . -}}
    <body>
        {{- partial "header.html" . -}}
        <main id="content">
        {{ if .IsHome }}<h1 class="visually-hidden">{{ .Site.Title }}</h1>{{ end }}
        {{- block "main" . }}{{- end }}
        </main>
        {{- partial "footer.html" . -}}
    </body>
</html>
